<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IL Insurance | Language Select</title>
  <meta name="description" content="IL Insurance. Επιλέξτε ελληνικά ή English.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://ildigitalassistant.com/">
  <link rel="alternate" hreflang="el" href="https://ildigitalassistant.com/el/">
  <link rel="alternate" hreflang="en" href="https://ildigitalassistant.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://ildigitalassistant.com/el/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IL Insurance">
  <meta property="og:title" content="IL Insurance">
  <meta property="og:description" content="IL Insurance. Επιλέξτε ελληνικά ή English.">
  <meta property="og:url" content="https://ildigitalassistant.com/">
  <meta property="og:image" content="https://ildigitalassistant.com/assets/hero-poster.jpg">
  <meta http-equiv="refresh" content="3; url=/el/"/>
  <link rel="preload" href="/assets/styles.css?v=3" as="style">
  <link rel="stylesheet" href="/assets/styles.css?v=3">
  <script>
    (function(){
      try {
        const saved = localStorage.getItem('site_lang');
        if (saved) { location.replace('/' + saved + '/'); return; }
        const lang = (navigator.language || 'en').toLowerCase();
        if (lang.startsWith('el')) location.replace('/el/');
        else location.replace('/en/');
      } catch(e){}
    })();
  </script>
  <style>body{display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body>
  <div class="center">
    <p>Redirecting… Μεταφορά στη σωστή γλώσσα…</p>
    <p><a href="/el/">Ελληνικά</a> | <a href="/en/">English</a></p>
  </div>
</body>
</html>
